<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरी शिक्षा - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
    }

    header {
      background: #174ea6;
      color: white;
      text-align: center;
      padding: 25px 10px;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    h2 {
      text-align: center;
      color: #174ea6;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #174ea6;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 मेरी शिक्षा</h1>
  <p>Admin Panel</p>
</header>

<div class="box">

  <h2>📄 PDF Upload करें</h2>

  <label>कक्षा चुनें</label>

  <select id="className">
    <option value="Class 9">Class 9</option>
    <option value="Class 10">Class 10</option>
    <option value="Class 11">Class 11</option>
    <option value="Class 12">Class 12</option>
  </select>

  <label>PDF का नाम</label>

  <input
    type="text"
    id="pdfName"
    placeholder="जैसे Maths Chapter 1"
  >

  <label>PDF File चुनें</label>

  <input
    type="file"
    id="pdfFile"
    accept="application/pdf"
  >

  <button id="uploadBtn">
    ☁️ PDF Upload & Publish
  </button>

  <div id="status"></div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

  import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyCywjJqzL2uvviE_64YRpvNbbEU-dYl5lg",

    authDomain: "mare-shiksha.firebaseapp.com",

    projectId: "mare-shiksha",

    storageBucket: "mare-shiksha.firebasestorage.app",

    messagingSenderId: "1024164594105",

    appId: "1:1024164594105:web:1538508329d8921b59b668",

    measurementId: "G-DXYMPBWP14"

  };


  const app = initializeApp(firebaseConfig);

  const storage = getStorage(app);

  const db = getFirestore(app);


  document
    .getElementById("uploadBtn")
    .addEventListener("click", async function () {

      const className =
        document.getElementById("className").value;

      const pdfName =
        document.getElementById("pdfName").value.trim();

      const file =
        document.getElementById("pdfFile").files[0];

      const status =
        document.getElementById("status");


      if (pdfName === "") {

        status.innerHTML =
          "❌ PDF का नाम डालो।";

        return;
      }


      if (!file) {

        status.innerHTML =
          "❌ पहले PDF file चुनो।";

        return;
      }


      if (file.type !== "application/pdf") {

        status.innerHTML =
          "❌ सिर्फ PDF file चुनो।";

        return;
      }


      try {

        status.innerHTML =
          "⏳ PDF upload हो रही है...";


        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const fileName =
          Date.now() + "_" + safeName;


        const storageRef =
          ref(
            storage,
            "pdfs/" +
            className +
            "/" +
            fileName
          );


        await uploadBytes(
          storageRef,
          file
        );


        const downloadURL =
          await getDownloadURL(
            storageRef
          );


        await addDoc(
          collection(db, "pdfs"),
          {
            className: className,
            pdfName: pdfName,
            pdfLink: downloadURL,
            fileName: file.name,
            createdAt: serverTimestamp()
          }
        );


        status.innerHTML =
          "✅ PDF सफलतापूर्वक Publish हो गई!";


        document.getElementById(
          "pdfName"
        ).value = "";

        document.getElementById(
          "pdfFile"
        ).value = "";


      } catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Error: " +
          error.message;

      }

    });

</script>

</body>
</html>
