<title>Admin Panel - मेरी शिक्षा</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f9;
}

.header{
    background:#174ea6;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:600px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px #ccc;
}

h2{
    color:#174ea6;
    margin-bottom:20px;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:0;
    border-radius:6px;
    background:#174ea6;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#0d3b82;
}

#result{
    margin-top:20px;
}

.pdf-item{
    background:#f8fafc;
    padding:15px;
    margin-top:10px;
    border-radius:8px;
    border-left:4px solid #174ea6;
}

.pdf-item a{
    display:inline-block;
    margin-top:8px;
    color:#198754;
    font-weight:bold;
}

.delete{
    background:#dc3545;
    margin-top:10px;
    padding:8px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h1>📚 मेरी शिक्षा</h1>
    <p>Admin Panel</p>
</div>

<div class="container">

<div class="card">

<h2>📄 PDF जोड़ें</h2>

<label>कक्षा चुनें</label>

<select id="className">
    
    <option value="Class 9">Class 9</option>
    <option value="Class 10">Class 10</option>
    <option value="Class 11">Class 11</option>
    <option value="Class 12">Class 12</option>
</select>

<label>PDF का नाम</label>

<input
    type="text"
    id="pdfName"
    placeholder="Maths">
  
    
<label>PDF का लिंक</label>

<input
    type="text"
    id="pdfLink"
    placeholder="PDF का URL डालें">

<button onclick="addPDF()">
    ➕ PDF Publish करें
</button>

<div id="result"></div>

</div>

</div>

<script>

let pdfs = JSON.parse(localStorage.getItem("pdfs")) || [];

function addPDF(){

    let className =
        document.getElementById("className").value;

    let pdfName =
        document.getElementById("pdfName").value;

    let pdfLink =
        document.getElementById("pdfLink").value;

    if(pdfName === "" || pdfLink === ""){
        alert("कृपया PDF का नाम और लिंक भरें!");
        return;
    }

    let pdf = {
        className: className,
        pdfName: pdfName,
        pdfLink: pdfLink
    };

    pdfs.push(pdf);

    localStorage.setItem(
        "pdfs",
        JSON.stringify(pdfs)
    );

    document.getElementById("pdfName").value = "";
    document.getElementById("pdfLink").value = "";

    showPDFs();

    alert("PDF Publish हो गई!");
}

function showPDFs(){

    let result =
        document.getElementById("result");

    result.innerHTML = "<h3>Published PDFs</h3>";

    pdfs.forEach((pdf,index)=>{

        result.innerHTML += `

        <div class="pdf-item">

            <b>${pdf.className}</b>

            <br>

            ${pdf.pdfName}

            <br>

            <a href="${pdf.pdfLink}"
               target="_blank">
               📖 PDF खोलें
            </a>

            <button
                class="delete"
                onclick="deletePDF(${index})">
                🗑️ Delete
  deletePDF(index){

    pdfs.splice(index,1);

    localStoragem(
        "pdfs",
        JSON.stringify(pdfs)
    );

    showPDFs();
}

showPDFs();

</script>
